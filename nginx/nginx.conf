# 화면 nginx 기본 설정. 쓰는 곳은 /tmp 뿐이다 (pid·임시 파일·web.conf). root 아님, 포트 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # 접속 기록에 조회 조건(?q=환자이름 등)을 남기지 않는다: $request 대신 $uri 만 쓴다.
    log_format main '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                    'rt=$request_time rid="$http_x_request_id"';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 시작할 때 web.conf.template 에서 만들어진 server 설정 (Dockerfile 의 NGINX_ENVSUBST_OUTPUT_DIR)
    include /tmp/web.conf;
}
